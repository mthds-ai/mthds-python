name: Tests check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

# Usage statistics are off for every job, as the usage-statistics specification requires of every repository's CI
# (conformance's specs/usage-statistics.md, rule R8): a CI run is never open-source use, and PostHog bills every event.
env:
  DO_NOT_TRACK: "1"

jobs:
# --------------------------------------------------------------------------
# 1.  Test matrix — one job per supported Python version
# --------------------------------------------------------------------------
  matrix-test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    # Least privilege: this job runs untrusted PR code and never uses OIDC, so it must not
    # be able to mint an id-token. Read-only contents is all the test steps need.
    permissions:
      contents: read
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      ENV: dev
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make gha-tests

      - name: The interpreter is the one this job names
        run: .venv/bin/python -c 'import sys; want = "${{ matrix.python-version }}"; got = "%d.%d" % sys.version_info[:2]; assert got == want, f"ran {got}, expected {want}"'

# --------------------------------------------------------------------------
# 2.  Aggregator job — the *single* required status check
# --------------------------------------------------------------------------
  tests-all:
    name: Tests (all)
    runs-on: ubuntu-latest
    needs: [matrix-test]
    if: always()

    steps:
      - name: Fail if any test job failed
        run: |
          if [ "${{ needs.matrix-test.result }}" != "success" ]; then
            echo "::error::At least one test job failed."
            exit 1
          fi
          echo "All test jobs passed."
