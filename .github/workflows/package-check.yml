name: package-check

on:
  pull_request:

# Usage statistics are off for every job, as the usage-statistics specification requires of every repository's CI
# (conformance's specs/usage-statistics.md, rule R8): a CI run is never open-source use, and PostHog bills every event.
env:
  DO_NOT_TRACK: "1"

jobs:
  uv-lock-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Check if uv.lock is up to date
        run: |
          uv lock --locked
          if ! git diff --exit-code uv.lock; then
            echo "❌ uv.lock is out of date!"
            echo "Please run 'uv lock' to update the lock file."
            exit 1
          else
            echo "✅ uv.lock is up to date!"
          fi
